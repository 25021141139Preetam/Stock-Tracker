name: Automated NSE Stock Tracker

on:
  schedule:
    # 10:30 UTC is 16:00 IST (4:00 PM IST), Monday through Friday
    - cron: '30 10 * * 1-5'
  workflow_dispatch: # Allows manual one-click execution from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U https://github.com/jugaad-coder/jugaad-data/archive/master.zip
          pip install -r requirements.txt

      - name: Run Stock Tracker Engine
        run: |
          python stock_tracker.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add automated_stock_price_tracker.xlsx portfolio_dashboard.html backups/
          git commit -m "Automated update: NSE closing prices [$(date +'%Y-%m-%d')]" || echo "No changes to commit"
          git push
